# Configuración de Prometheus 

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'dinex-tracking'
    environment: 'dev'

# Configuración de alertas 
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Archivos de reglas de alertas
rule_files:
  # - "alerts.yml"


scrape_configs:
  
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'


  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'


  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: 'loki'
